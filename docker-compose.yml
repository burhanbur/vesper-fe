services:
  web:
    image: vesper-web:${WEB_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-Vesper}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL to the public backend URL including /api/v1}
        VITE_APP_ENV: ${VITE_APP_ENV:-production}
        VITE_ENABLE_MOCKS: 'false'
    restart: unless-stopped
    ports:
      - '${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-5173}:8080'
    env_file:
      - .env.production
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
