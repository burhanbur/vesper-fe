# Initial HTTP virtual host; use Certbot to add TLS and redirect HTTP.
<VirtualHost *:80>
    ServerName vesper.sprigan.my.id

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:5173/ connectiontimeout=5 timeout=60
    ProxyPassReverse / http://127.0.0.1:5173/
</VirtualHost>
